# LavTr — SaaS multi-tenant de lavanderia com delivery (adaptação brasileira, base eWash MIT)
name = "lavtr"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Serve the built Vue SPA. API routes under /api/* are handled by the Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "lavtr"
database_id = "" # preenchido por `bun run deploy` (wrangler d1 create lavtr)
migrations_dir = "migrations"

# Secrets (JWT_SECRET, PIX_CALLBACK_SECRET, SMTP_PASSWORD, GOOGLE_CLIENT_SECRET,
# SMS_API_KEY) são criados como worker secrets pelo `bun run deploy`
# (ou via `wrangler secret put <KEY>`). Localmente vêm de api/.dev.vars.
[vars]
ENVIRONMENT = "production"
APP_URL = "https://lavtr.example.com" # substituir pelo domínio real
# Moeda e locale padrão do Brasil
APP_LOCALE = "pt-BR"
APP_CURRENCY = "BRL"
# Email: credenciais entram como secret (SMTP_USERNAME/SMTP_PASSWORD)
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
EMAIL_FROM_NAME = "LavTr Sistema de Lavanderia"
# Google OAuth: criar client id próprio em console.cloud.google.com
# GOOGLE_CLIENT_ID = ""
# SMS (opcional): definir SMS_BASE_URL/secret com gateway brasileiro se necessário

[triggers]
# Diariamente (9h BR): despesa recorrente devida e lembrete de pedidos não coletados
crons = ["0 9 * * *"]
