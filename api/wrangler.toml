# Cloudflare requires lowercase infra names; the product brand is "eWash".
name = "ewash"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Serve the built Vue SPA. API routes under /api/* are handled by the Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ewash"
database_id = "03efc56b-600c-4a97-bbd9-3d05810e0bbe"
migrations_dir = "migrations"

# Secrets (JWT_SECRET, MPESA_CALLBACK_SECRET) are NOT set here: locally they
# come from api/.dev.vars (gitignored); in production `bun run deploy`
# auto-creates them as worker secrets. ENVIRONMENT defaults to production for
# deploys; api/.dev.vars overrides it to development for local runs.
[vars]
ENVIRONMENT = "production"
APP_URL = "https://ewash.qesuite.com"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USERNAME = "notificationsqesuite@gmail.com"
EMAIL_FROM_NAME = "eWash Laundry System"
# public OAuth client id (the secret is a worker secret / .dev.vars entry)
GOOGLE_CLIENT_ID = "1072526180713-31bjrvajg36ihif92c4kh0bnkdcl0r91.apps.googleusercontent.com"

[triggers]
# Daily: post due recurring expenses, uncollected-order reminders
crons = ["0 6 * * *"]
